[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dm_bot"]

[project]
name = "linkedin-dm-bot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "sqlite-utils>=3.39",
    "playwright>=1.40.0",
    "typer>=0.9.0",
    "requests>=2.32.5",
    "trafilatura>=2.0.0",
]

[project.scripts]
dm-bot = "dm_bot.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.92.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
]
